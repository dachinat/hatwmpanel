<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="808" height="808" viewBox="108 114 808 808"
     preserveAspectRatio="xMidYMid meet"
     role="img" aria-labelledby="title description">
  <title id="title">HatWM wizard hat icon</title>
  <desc id="description">A wizard hat launcher mark with a configurable color on a transparent background.</desc>

  <defs>
    <linearGradient id="hat-fill" x1="0" y1="0" x2="1" y2="1">
      <stop id="fill-start" offset="0" stop-color="#3d71a7"/>
      <stop id="fill-middle" offset="0.52" stop-color="#315b86"/>
      <stop id="fill-end" offset="1" stop-color="#244464"/>
    </linearGradient>
    <linearGradient id="cyan-stroke" x1="0" y1="0" x2="0.9" y2="1">
      <stop id="outline-start" offset="0" stop-color="#7fcaff"/>
      <stop id="outline-middle" offset="0.45" stop-color="#6aa9e9"/>
      <stop id="outline-end" offset="1" stop-color="#74b9ff"/>
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feFlood id="outline-glow" flood-color="#6aa9e9" flood-opacity="0.38"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- The brim sits behind the crown so both shapes remain independently editable. -->
  <path id="brim"
        d="M 246 628
           C 323 594 414 580 512 580
           C 610 580 701 594 778 628
           C 873 670 912 723 884 770
           C 842 841 693 895 512 897
           C 331 895 182 841 140 770
           C 112 723 151 670 246 628 Z"
        fill="url(#hat-fill)"
        stroke="url(#cyan-stroke)"
        stroke-width="20"
        stroke-linejoin="round"
        filter="url(#soft-glow)"/>

  <!-- Crown silhouette closely follows the proportions of the uploaded icon. -->
  <path id="crown"
        d="M 292 687
           L 499 156
           Q 512 122 525 156
           L 732 687
           Q 738 704 723 715
           C 665 759 591 780 512 780
           C 433 780 359 759 301 715
           Q 286 704 292 687 Z"
        fill="url(#hat-fill)"
        stroke="url(#cyan-stroke)"
        stroke-width="20"
        stroke-linejoin="round"
        filter="url(#soft-glow)"/>

  <!-- Fine inner highlight keeps the cyan edge crisp without a heavy neon effect. -->
  <path id="inner-highlight" d="M 501 159
           Q 512 131 523 159
           L 728 688
           M 296 689
           C 354 738 431 762 512 762
           C 593 762 670 738 728 689"
        fill="none"
        stroke="#94ecff"
        stroke-width="5"
        stroke-linecap="round"
        opacity="0.72"/>
</svg>
